# Use this blueprint when the contents of backend/ are your repository root.
services:
  - type: web
    name: ks-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: ks_finance
      - key: CORS_ORIGINS
        value: "*"
